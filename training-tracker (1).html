<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Training Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171613;
    --bg-elevated: #201f1b;
    --card: #211f1b;
    --card-border: #33312a;
    --ink: #ece6d9;
    --ink-dim: #9c9689;
    --ink-faint: #6b6759;
    --accent: #d9b23c;
    --accent-ink: #171613;
    --done: #5c7d5e;
    --done-bg: #1c2419;
    --danger: #b8563f;
    --radius: 14px;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f1e8;
    --bg-elevated: #ffffff;
    --card: #ffffff;
    --card-border: #e2ddcc;
    --ink: #201f1b;
    --ink-dim: #6b6759;
    --ink-faint: #8f8a78;
    --accent: #a97e0a;
    --accent-ink: #ffffff;
    --done: #4a6b4c;
    --done-bg: #e7ecdf;
    --danger: #a3432c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f1e8;
      --bg-elevated: #ffffff;
      --card: #ffffff;
      --card-border: #e2ddcc;
      --ink: #201f1b;
      --ink-dim: #6b6759;
      --ink-faint: #8f8a78;
      --accent: #a97e0a;
      --accent-ink: #ffffff;
      --done: #4a6b4c;
      --done-bg: #e7ecdf;
      --danger: #a3432c;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px 16px 48px;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .title-block h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .meta-row {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .meta-row span b { color: var(--ink); font-weight: 600; }

  .icon-btn {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--ink);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--card-border);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.35s ease;
    width: 0%;
  }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

  li.card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    position: relative;
  }
  li.card:active { transform: scale(0.985); }

  li.card.done {
    background: var(--done-bg);
    border-color: var(--done);
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--ink-faint);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  li.card.done .check {
    background: var(--done);
    border-color: var(--done);
  }
  .check svg {
    width: 14px;
    height: 14px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  li.card.done .check svg { opacity: 1; }

  .exercise-name {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
    flex: 1;
  }
  li.card.done .exercise-name {
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    color: var(--ink-dim);
  }

  .type-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  li.card.done .type-tag { opacity: 0.55; }

  .card-details {
    display: flex;
    gap: 18px;
    margin-top: 10px;
    padding-left: 36px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .card-details .num b {
    color: var(--ink);
    font-weight: 600;
  }
  li.card.done .card-details, li.card.done .card-details .num b { color: var(--ink-faint); }

  .notes {
    margin-top: 8px;
    padding-left: 36px;
    font-size: 13px;
    color: var(--ink-dim);
    font-style: italic;
    line-height: 1.4;
  }

  .state-box {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .state-box.error { color: var(--danger); }

  textarea#pasteArea {
    width: 100%;
    min-height: 140px;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-top: 12px;
    resize: vertical;
  }
  .paste-actions { display: flex; gap: 8px; margin-top: 10px; }
  button.pill {
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: var(--bg-elevated);
    color: var(--ink);
    cursor: pointer;
  }
  button.pill.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  footer.reset-row {
    margin-top: 22px;
    text-align: center;
  }
  footer.reset-row button {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>Today's session</h1>
      <div class="meta-row" id="metaRow">
        <span>loading…</span>
      </div>
    </div>
    <button class="icon-btn" id="refreshBtn" title="Refresh from sheet" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="content">
    <div class="state-box" id="stateBox">Fetching your sheet…</div>
  </div>

  <footer class="reset-row" id="resetRow" style="display:none;">
    <button id="resetBtn">Clear today's checkmarks</button>
  </footer>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS3vqlfus_x25quGwaZmLnjZo5o-5Of0NWISRRmEXgx6limFs-10staTg2GzqDE6qXIu1DtsZ1Koc5l/pub?output=csv";

const contentEl = document.getElementById('content');
const stateBox = document.getElementById('stateBox');
const metaRow = document.getElementById('metaRow');
const progressFill = document.getElementById('progressFill');
const resetRow = document.getElementById('resetRow');
const refreshBtn = document.getElementById('refreshBtn');

let currentDate = null;

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function findHeaderRowIndex(rows) {
  for (let i = 0; i < rows.length; i++) {
    const norm = rows[i].map(c => (c || '').trim().toLowerCase());
    if (norm.includes('exercise') && norm.includes('sets')) return i;
  }
  return -1;
}

function extractSession(csvText) {
  const rows = parseCSV(csvText);
  const headerIdx = findHeaderRowIndex(rows);
  if (headerIdx === -1) throw new Error('Could not find the header row (looking for "Exercise" and "Sets" columns).');

  const headers = rows[headerIdx].map(h => (h || '').trim());
  const colIndex = name => headers.findIndex(h => h.toLowerCase() === name.toLowerCase());

  const iDate = colIndex('Date');
  const iWeek = colIndex('Week');
  const iTraining = colIndex('Training');
  const iExercise = colIndex('Exercise');
  const iSets = colIndex('Sets');
  const iReps = colIndex('Reps');
  const iWeight = colIndex('Weight');
  const iType = colIndex('Type');
  const iNotes = colIndex('Notes');

  const exercises = [];
  let date = null, week = null, training = null;

  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const exerciseVal = (iExercise > -1 ? row[iExercise] : '') || '';
    if (!exerciseVal.trim()) {
      if (exercises.length) break; // blank row after data = end of this session's list
      continue; // skip leading blank rows
    }
    if (date === null && iDate > -1) date = (row[iDate] || '').trim();
    if (week === null && iWeek > -1) week = (row[iWeek] || '').trim();
    if (training === null && iTraining > -1) training = (row[iTraining] || '').trim();

    exercises.push({
      exercise: exerciseVal.trim(),
      sets: (iSets > -1 ? row[iSets] : '') || '',
      reps: (iReps > -1 ? row[iReps] : '') || '',
      weight: (iWeight > -1 ? row[iWeight] : '') || '',
      type: (iType > -1 ? row[iType] : '') || '',
      notes: (iNotes > -1 ? row[iNotes] : '') || ''
    });
  }

  // fallback: look for the summary "Date  18/09/2026" line near the top if not found in header row area
  if (!date) {
    for (let r = 0; r < headerIdx; r++) {
      const row = rows[r];
      if (row[0] && row[0].trim().toLowerCase() === 'date' && row[1] && row[1].trim()) {
        date = row[1].trim();
        break;
      }
    }
  }

  return { date, week, training, exercises };
}

function storageKeyPrefix(date) {
  return `training-done:${date || 'unknown'}:`;
}

function getDone(date, exerciseName) {
  try {
    return localStorage.getItem(storageKeyPrefix(date) + exerciseName) === '1';
  } catch (e) { return false; }
}

function setDone(date, exerciseName, val) {
  try {
    const key = storageKeyPrefix(date) + exerciseName;
    if (val) localStorage.setItem(key, '1');
    else localStorage.removeItem(key);
  } catch (e) { /* storage unavailable, ignore */ }
}

function clearAllDone(date) {
  try {
    const prefix = storageKeyPrefix(date);
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  } catch (e) { /* ignore */ }
}

function updateProgress(session) {
  const total = session.exercises.length;
  const done = session.exercises.filter(e => getDone(session.date, e.exercise)).length;
  progressFill.style.width = total ? `${(done / total) * 100}%` : '0%';
  const label = document.getElementById('progressLabel');
}

function render(session) {
  currentDate = session.date;
  const metaParts = [];
  if (session.date) metaParts.push(`<span><b>${escapeHtml(session.date)}</b></span>`);
  if (session.week) metaParts.push(`<span>Week <b>${escapeHtml(session.week)}</b></span>`);
  if (session.training) metaParts.push(`<span>Session <b>${escapeHtml(session.training)}</b></span>`);
  const doneCount = session.exercises.filter(e => getDone(session.date, e.exercise)).length;
  metaParts.push(`<span><b>${doneCount}/${session.exercises.length}</b> done</span>`);
  metaRow.innerHTML = metaParts.join('');

  if (!session.exercises.length) {
    contentEl.innerHTML = '<div class="state-box">No exercises found for today\'s date. Check the sheet\'s dropdown is set correctly.</div>';
    resetRow.style.display = 'none';
    progressFill.style.width = '0%';
    return;
  }

  const ul = document.createElement('ul');
  ul.className = 'list';

  session.exercises.forEach((ex, idx) => {
    const li = document.createElement('li');
    li.className = 'card';
    const done = getDone(session.date, ex.exercise);
    if (done) li.classList.add('done');
    li.dataset.exercise = ex.exercise;

    const setsReps = [ex.sets, ex.reps].filter(Boolean).join(' × ');

    li.innerHTML = `
      <div class="card-top">
        <div class="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="exercise-name">${escapeHtml(ex.exercise)}</div>
        ${ex.type ? `<div class="type-tag">${escapeHtml(ex.type)}</div>` : ''}
      </div>
      <div class="card-details">
        ${setsReps ? `<div class="num">Sets × Reps <b>${escapeHtml(setsReps)}</b></div>` : ''}
        ${ex.weight ? `<div class="num">Weight <b>${escapeHtml(ex.weight)}</b></div>` : ''}
      </div>
      ${ex.notes ? `<div class="notes">${escapeHtml(ex.notes)}</div>` : ''}
    `;

    li.addEventListener('click', () => {
      const nowDone = !li.classList.contains('done');
      li.classList.toggle('done', nowDone);
      setDone(session.date, ex.exercise, nowDone);
      updateProgress(session);
      const doneNow = session.exercises.filter(e => getDone(session.date, e.exercise)).length;
      const label = metaRow.querySelector('span:last-child');
      if (label) label.innerHTML = `<b>${doneNow}/${session.exercises.length}</b> done`;
    });

    ul.appendChild(li);
  });

  contentEl.innerHTML = '';
  contentEl.appendChild(ul);
  resetRow.style.display = 'block';
  updateProgress(session);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showError(message) {
  contentEl.innerHTML = `
    <div class="state-box error">${escapeHtml(message)}</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-dim);text-align:center;margin-top:6px;">
      Paste the sheet's CSV content below instead:
    </div>
    <textarea id="pasteArea" placeholder="Paste CSV content here…"></textarea>
    <div class="paste-actions">
      <button class="pill primary" id="pasteLoadBtn">Load pasted data</button>
    </div>
  `;
  document.getElementById('pasteLoadBtn').addEventListener('click', () => {
    const text = document.getElementById('pasteArea').value;
    if (!text.trim()) return;
    try {
      const session = extractSession(text);
      render(session);
    } catch (e) {
      showError(e.message || 'Could not parse that CSV.');
    }
  });
}

async function fetchCsvText() {
  // First try: fetch the sheet directly.
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (res.ok) return await res.text();
  } catch (e) {
    // fall through to proxy attempt
  }
  // Fallback: some browsers block cross-origin fetches from a page opened
  // locally (file://). Retry through a CORS-friendly relay.
  const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(CSV_URL) + '&_=' + Date.now();
  const res2 = await fetch(proxied, { cache: 'no-store' });
  if (!res2.ok) throw new Error(`Sheet responded with status ${res2.status}.`);
  return await res2.text();
}

async function load() {
  refreshBtn.classList.add('spinning');
  contentEl.innerHTML = '<div class="state-box" id="stateBox">Fetching your sheet…</div>';
  metaRow.innerHTML = '<span>loading…</span>';
  try {
    const text = await fetchCsvText();
    const session = extractSession(text);
    render(session);
  } catch (err) {
    console.error(err);
    showError(
      err.message && err.message.includes('header row')
        ? err.message
        : "Couldn't fetch the sheet automatically, even through the backup route. Check your connection, or that the sheet is still published."
    );
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

refreshBtn.addEventListener('click', load);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (currentDate) {
    clearAllDone(currentDate);
    load();
  }
});

load();
</script>
</body>
</html>
